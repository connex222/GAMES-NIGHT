name: Games Night catalogue quality gate
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/*logo*'
      - 'tests/**'
      - '.github/workflows/catalogue-validation.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/*logo*'
      - 'tests/**'
      - '.github/workflows/catalogue-validation.yml'
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate published destinations, official logos and catalogue ordering
        run: node --test tests/catalogue.test.mjs
