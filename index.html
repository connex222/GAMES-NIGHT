  /* ---------- Page colours: a dark stage, high contrast for any room ---------- */
  :root {
    color-scheme: dark;
    --page: #0B0718;
    --surface: #1A1430;
    --text: #FFFFFF;
    --muted: #C9C2E0;
    --line: #3A2F5C;
    --focus: #FFE45C;
    --display: Rockwell, "Rockwell Nova", "Roboto Slab", "Zilla Slab", "DejaVu Serif", Georgia, serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --inter: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --didot: Didot, "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: var(--body);
    font-size: clamp(1rem, 0.9rem + 0.35vw, 1.25rem);
    line-height: 1.5;
    background-color: var(--page);
    background-image:
      radial-gradient(60vw 45vw at 12% -10%, rgba(255, 76, 170, 0.22), transparent 70%),
      radial-gradient(60vw 45vw at 88% -10%, rgba(93, 232, 245, 0.18), transparent 70%),
      radial-gradient(80vw 50vw at 50% 110%, rgba(215, 33, 238, 0.16), transparent 70%),
      radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.5px);
    background-size: auto, auto, auto, 26px 26px;
    background-attachment: fixed;
  }

  /* ---------- Layout ---------- */
  .wrap { max-width: 112rem; margin: 0 auto; padding: clamp(1.25rem, 3vw, 3rem) clamp(1rem, 3vw, 3rem) 2rem; }
  header.top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 1.25rem clamp(1.5rem, 3vw, 3rem);
    margin-bottom: clamp(1.5rem, 3vw, 2.75rem);
  }
  @media (max-width: 760px) { header.top { grid-template-columns: 1fr; } }

  /* The marquee sign: a brass frame of chasing bulbs around a neon title */
  .marquee {
    position: relative; isolation: isolate;
    padding: 18px; border-radius: 26px;
    background: linear-gradient(180deg, #5A3A12, #2B1A06);
    box-shadow: 0 18px 60px rgba(0,0,0,.55), inset 0 0 0 2px #8C6A2A;
  }
  .marquee::before, .marquee::after {
    content: ""; position: absolute; inset: 5px; border-radius: 22px; z-index: 0;
    background-image: radial-gradient(circle, #FFF6D0 0 3px, #FFC94A 4px, rgba(255,180,40,.35) 5.5px, transparent 7px);
    background-size: 26px 26px;
    animation: chase 0.9s steps(1) infinite;
  }
  .marquee::after { background-position: 13px 13px; animation-delay: 0.45s; }
  @keyframes chase { 0% { opacity: 1; } 50% { opacity: 0.18; } }
  .marquee-inner {
    position: relative; z-index: 1;
    padding: clamp(1.1rem, 2.4vw, 2rem) clamp(1.2rem, 3vw, 2.6rem);
    border-radius: 12px;
    background: radial-gradient(120% 140% at 50% 0%, #2A1550 0%, #120A26 60%, #08051A 100%);
    box-shadow: inset 0 0 40px rgba(0,0,0,.7);
  }
  .kicker {
    margin: 0 0 0.35rem; font-weight: 800; letter-spacing: 0.04em;
    color: #5DE8F5; text-shadow: 0 0 10px rgba(93,232,245,.8);
  }
  h1 {
    margin: 0;
    font-family: var(--display); font-weight: 700;
    font-size: clamp(3rem, 2rem + 5vw, 7rem);
    line-height: 0.92; letter-spacing: -0.01em;
    color: #FFF4FB;
    text-shadow:
      0 0 4px #FFFFFF,
      0 0 14px #FF4CAA,
      0 0 34px #FF4CAA,
      0 0 70px #D721EE,
      0 0 110px #D721EE;
    animation: neon-on 2.2s ease-out 1 both;
  }
  /* One flicker as the sign switches on, then it stays lit */
  @keyframes neon-on {
    0%   { opacity: 0.1; text-shadow: none; }
    8%   { opacity: 1; }
    11%  { opacity: 0.2; text-shadow: none; }
    16%  { opacity: 1; }
    19%  { opacity: 0.35; text-shadow: none; }
    30%, 100% { opacity: 1; }
  }
  .intro { margin: 0.8rem 0 0; color: var(--muted); max-width: 44ch; }

  .side { display: flex; flex-direction: column; align-items: stretch; gap: 0.8rem; min-width: min(100%, 20rem); }
  .summary {
    font-weight: 700; margin: 0; padding: 0.6rem 1.1rem; text-align: center;
    border: 2px solid var(--line); border-radius: 999px; background: var(--surface);
  }
  button.spin {
    font: inherit; font-family: var(--display); font-weight: 700;
    font-size: clamp(1.2rem, 1rem + 0.8vw, 1.7rem);
    padding: 0.9rem 1.4rem; border: 0; border-radius: 16px; cursor: pointer;
    color: #1B0B12;
    background: linear-gradient(180deg, #FFE45C 0%, #FFB627 55%, #F08A00 100%);
    box-shadow: 0 6px 0 #9C4F00, 0 12px 30px rgba(255,182,39,.35);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  button.spin:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #9C4F00, 0 16px 36px rgba(255,182,39,.45); }
  button.spin:active { transform: translateY(5px); box-shadow: 0 1px 0 #9C4F00, 0 6px 16px rgba(255,182,39,.3); }
  button.spin:disabled { cursor: progress; filter: saturate(.6) brightness(.9); }
  button.spin:focus-visible { outline: 4px solid #FFFFFF; outline-offset: 4px; }
  .pick-result { margin: 0; min-height: 1.5em; text-align: center; font-weight: 700; color: var(--focus); }

  /* ---------- Shared tile structure ---------- */
  .grid {
    list-style: none; margin: 0; padding: 0; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr));
    gap: clamp(0.9rem, 1.6vw, 1.5rem);
  }
  .grid > li { display: flex; }
  .grid > li > .game { flex: 1; }
  .game {
    position: relative; display: flex; flex-direction: column;
    min-height: clamp(15.5rem, 22vw, 20rem);
    padding: clamp(1.1rem, 1.6vw, 1.6rem);
    border-radius: 16px; text-decoration: none; overflow: hidden; outline: none;
    border: 2px solid transparent;
    transition: transform 0.15s ease;
  }
  .game { box-shadow: 0 10px 30px rgba(0,0,0,.45); transition: transform 0.15s ease, box-shadow 0.2s ease; }
  .game:hover { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--glow), 0 14px 40px color-mix(in srgb, var(--glow) 45%, transparent); }
  .game:focus-visible {
    transform: scale(1.03);
    box-shadow: 0 0 0 4px var(--page), 0 0 0 9px var(--focus), 0 0 50px color-mix(in srgb, var(--glow) 60%, transparent);
  }
  .game.lit {
    transform: scale(1.045);
    box-shadow: 0 0 0 4px #FFFFFF, 0 0 40px 8px var(--glow);
    z-index: 2;
  }
  .game.winner { animation: winner 0.6s ease-in-out 4 alternate; }
  @keyframes winner {
    from { box-shadow: 0 0 0 4px #FFFFFF, 0 0 30px 6px var(--glow); }
    to   { box-shadow: 0 0 0 6px var(--glow), 0 0 80px 20px var(--glow); }
  }
  .g-ragnagrok { --glow: #FF8A4C; }
  .g-gilded    { --glow: #E1AC48; }
  .g-ecky      { --glow: #DDFF19; }
  .g-noggin    { --glow: #FF4CAA; }
  .g-quiz      { --glow: #EFD690; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .motif { position: absolute; right: -0.5rem; top: -0.5rem; width: clamp(6rem, 9vw, 8.5rem); height: auto; pointer-events: none; }
  .name {
    margin: clamp(2.4rem, 4.2vw, 3.6rem) 4.5rem 0.5rem 0;
    font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.7rem);
    line-height: 1.02; text-wrap: balance;
  }
  .tagline { margin: 0 0 0.35rem; max-width: 30ch; }
  .desc { margin: 0.3rem 0 0.7rem; font-family: var(--body); font-size: 0.9em; line-height: 1.45; opacity: 0.92; text-wrap: pretty; }
  .g-quiz .desc, .g-lastcard .desc { text-align: center; }
  .play { margin: 0 0 1rem; font-size: 0.92em; opacity: 0.85; }
  .status {
    margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 0.55rem;
    padding: 0.35rem 0.85rem 0.35rem 0.7rem; border-radius: 999px;
    background: rgba(0, 0, 0, 0.32); color: #FFFFFF; font-family: var(--body); font-size: 0.9em; font-weight: 600;
  }
  .dot { width: 0.75em; height: 0.75em; border-radius: 50%; background: #F5B83D; box-shadow: 0 0 0 2px rgba(255,255,255,0.6); }
  .game[data-state="waking"] .dot { animation: pulse 1.2s ease-in-out infinite; }
  .game[data-state="ready"] .dot { background: #4BD37B; }
  .game[data-state="down"] .dot { background: #FF5A5A; }
  @keyframes pulse { 50% { opacity: 0.25; } }

  /* ======================================================
     Each tile below copies its own game's look
     ====================================================== */

  /* Ragnagrok: night-purple sky, official stone-and-lava logo, mower orange */
  .g-ragnagrok {
    background:
      radial-gradient(90% 55% at 50% 30%, rgba(255,138,76,.28), transparent 70%),
      linear-gradient(160deg, #3B2A52 0%, #1F1530 55%, #150E20 100%);
    border-color: #4F3C69; color: #F7F0E3; font-family: var(--inter);
  }
  .g-ragnagrok .name { margin: -0.3rem -0.4rem 0.4rem; }
  .g-ragnagrok .logo { display: block; width: 100%; max-width: 22rem; height: auto; margin: 0 auto; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
  .g-ragnagrok .tagline { color: #FF8A4C; font-weight: 800; font-size: 1.1em; }
  .g-ragnagrok .play { color: #C3B5D3; opacity: 1; }

  /* Gilded Five: October 2026 refresh, deep emerald felt and gold */
  .g-gilded {
    background:
      radial-gradient(ellipse at 12% 14%, rgba(41,124,108,.5), transparent 45%),
      radial-gradient(ellipse at 90% 100%, rgba(225,172,72,.14), transparent 50%),
      linear-gradient(165deg, #155B50 0%, #092D2B 45%, #06191E 100%);
    border-color: rgba(239,188,93,.5); color: #F8F8F3; font-family: Georgia, "Times New Roman", serif;
    box-shadow: inset 0 0 0 6px #092D2B, inset 0 0 0 7px rgba(239,188,93,.4), 0 10px 30px rgba(0,0,0,.45);
  }
  .g-gilded .name { margin: -0.2rem -0.3rem 0.5rem; }
  .g-gilded .logo { display: block; width: 100%; max-width: 21rem; height: auto; margin: 0 auto; }

const grid = document.getElementById("grid");
const summary = document.getElementById("summary");
const keepAwake = document.getElementById("keepAwake");
const wakeAllBtn = document.getElementById("wakeAll");

const WAKE_TIMEOUT_MS = 120000;         // give a sleeping game up to 2 minutes
const KEEP_AWAKE_EVERY_MS = 10 * 60000; // re-ping every 10 minutes

/* ---------- Build the tiles ---------- */
const tiles = GAMES.map((g) => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "game g-" + g.style;
  a.href = g.url;
  a.dataset.state = "waking";
  a.innerHTML =
    '<svg class="motif" viewBox="0 0 100 100" aria-hidden="true">' + (MOTIFS[g.motif] || MOTIFS.spark) + "</svg>" +
    '<h2 class="name"></h2>' +
    '<p class="tagline"></p>' +
    '<p class="desc"></p>' +
    '<p class="play"></p>' +
    '<span class="status"><span class="dot" aria-hidden="true"></span><span class="label">Waking up…</span></span>';
  const nameEl = a.querySelector(".name");
  if (g.motif === "none") a.querySelector(".motif").remove();
  if (g.brand) {
    nameEl.classList.add("brand-mark");
    const icon = document.createElement("span");
    icon.className = "brand-icon";
    icon.setAttribute("aria-hidden", "true");
    icon.textContent = g.brand;
    const words = document.createElement("span");
    words.className = "brand-words";
    const title = document.createElement("span");
    title.className = "brand-title";
    title.textContent = g.name;
    words.appendChild(title);
    if (g.sub) {
      const sub = document.createElement("span");
      sub.className = "brand-sub";
      sub.textContent = g.sub;
      words.appendChild(sub);
    }
    nameEl.append(icon, words);
  } else
  if (g.logo && LOGOS[g.logo]) {
    const img = document.createElement("img");
    img.className = "logo";
    img.src = LOGOS[g.logo];
    img.alt = g.name;
    nameEl.appendChild(img);
  } else if (g.letters) {
    nameEl.setAttribute("aria-label", g.name);
    [...g.name].forEach((ch) => {
      const s = document.createElement("span");
      s.textContent = ch;
      s.setAttribute("aria-hidden", "true");
      nameEl.appendChild(s);
    });
  } else {
    nameEl.textContent = g.name;
  }
  a.querySelector(".tagline").textContent = g.tagline;
  a.querySelector(".desc").textContent = g.desc || "";
  if (g.faces && FACES[g.faces]) {
    const row = document.createElement("span");
    row.className = "faces";
    row.setAttribute("aria-hidden", "true");
    FACES[g.faces].forEach((src) => { const im = document.createElement("img"); im.src = src; im.alt = ""; row.appendChild(im); });
    a.querySelector(".tagline").before(row);
  }
  if (g.pills) {
    const list = document.createElement("span");
    list.className = "pills";
    g.pills.forEach((t) => { const pill = document.createElement("span"); pill.className = "pill"; pill.textContent = t; list.appendChild(pill); });
    a.querySelector(".desc").after(list);
  }
  a.querySelector(".play").textContent = g.play;
  li.appendChild(a);
  grid.appendChild(li);
  return { game: g, el: a, label: a.querySelector(".label"), started: 0, timer: null };
});

/* ---------- Status helpers ---------- */
function setState(t, state) {
  t.el.dataset.state = state;
  clearInterval(t.timer);
  t.timer = null;
  if (state === "waking") {
    t.started = Date.now();
    t.label.textContent = "Waking up…";
    t.timer = setInterval(() => {
      const s = Math.round((Date.now() - t.started) / 1000);
      t.label.textContent = s < 3 ? "Waking up…" : "Waking up… " + s + "s";
    }, 1000);
  } else if (state === "ready") {
    t.label.textContent = "Ready to play";
  } else {
    t.label.textContent = "Not responding, select to try";
  }
  updateSummary();
}

function updateSummary() {
  const total = tiles.length;
  const ready = tiles.filter((t) => t.el.dataset.state === "ready").length;
  const down = tiles.filter((t) => t.el.dataset.state === "down").length;
  if (ready === total) summary.textContent = "All " + total + " games ready";
  else if (down && ready + down === total) summary.textContent = ready + " of " + total + " ready, " + down + " not responding";
  else summary.textContent = ready + " of " + total + " games ready";
}

/* ---------- Wake one game ----------
   A "no-cors" request reaches the game's server and starts it if it's asleep.
   The browser can't read the reply, but the request finishing means the
   server answered. */
async function wake(t, quiet) {
  if (!quiet) setState(t, "waking");
  const ctrl = new AbortController();
  const abort = setTimeout(() => ctrl.abort(), WAKE_TIMEOUT_MS);
  try {
    await fetch(new URL(t.game.url).origin + "/?wake=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
    setState(t, "ready");
  } catch (e) {
    setState(t, "down");
  } finally {
    clearTimeout(abort);
  }
}

function wakeAll(quiet) {
  tiles.forEach((t) => wake(t, quiet && t.el.dataset.state === "ready"));
}

/* ---------- Keep awake while the page is open ---------- */
let keepTimer = null;
function startKeepAwake() { stopKeepAwake(); keepTimer = setInterval(() => wakeAll(true), KEEP_AWAKE_EVERY_MS); }
function stopKeepAwake() { clearInterval(keepTimer); keepTimer = null; }
keepAwake.addEventListener("change", () => { keepAwake.checked ? (startKeepAwake(), wakeAll(true)) : stopKeepAwake(); });
wakeAllBtn.addEventListener("click", () => wakeAll(false));

/* ---------- TV remote / keyboard arrows move between tiles ---------- */
grid.addEventListener("keydown", (e) => {
  const keys = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"];
  if (!keys.includes(e.key)) return;
  const links = tiles.map((t) => t.el);
  const i = links.indexOf(document.activeElement);
  if (i === -1) return;
  const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
  let n = i;
  if (e.key === "ArrowLeft") n = i - 1;
  if (e.key === "ArrowRight") n = i + 1;
  if (e.key === "ArrowUp") n = i - cols;
  if (e.key === "ArrowDown") n = i + cols;
  if (n >= 0 && n < links.length) { e.preventDefault(); links[n].focus(); }
});


/* ---------- Sound effects (made in the browser, no files) ---------- */
const soundOn = document.getElementById("soundOn");
let audio = null;
function tone(freq, start, dur, type, vol) {
  if (!soundOn.checked) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime + start;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audio.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  } catch (e) { /* sound is optional */ }
}
const tick = () => tone(880, 0, 0.05, "square", 0.05);
function fanfare() {
  [[523, 0], [659, 0.12], [784, 0.24], [1047, 0.36]].forEach(([f, t]) => tone(f, t, 0.35, "triangle", 0.12));
  [523, 659, 784].forEach((f) => tone(f, 0.55, 0.9, "sawtooth", 0.04));
}

/* ---------- Confetti ---------- */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
let bits = [];
let confettiRunning = false;
const COLOURS = ["#FF4CAA", "#5DE8F5", "#FFD968", "#B5F87E", "#DDFF19", "#D721EE", "#FF8A4C", "#FFFFFF", "#D4AF37"];
function sizeCanvas() {
  const r = window.devicePixelRatio || 1;
  canvas.width = innerWidth * r;
  canvas.height = innerHeight * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
function burst(x, y, count) {
  sizeCanvas();
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 4 + Math.random() * 9;
    bits.push({
      x, y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 6,
      w: 6 + Math.random() * 7,
      h: 4 + Math.random() * 5,
      r: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.4,
      c: COLOURS[(Math.random() * COLOURS.length) | 0],
      life: 140 + Math.random() * 60
    });
  }
  if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(drawConfetti); }
}
function drawConfetti() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  bits = bits.filter((b) => b.life > 0 && b.y < innerHeight + 40);
  bits.forEach((b) => {
    b.vy += 0.28; b.vx *= 0.985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life--;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.r);
    ctx.globalAlpha = Math.min(1, b.life / 40);
    ctx.fillStyle = b.c;
    ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    ctx.restore();
  });
  if (bits.length) requestAnimationFrame(drawConfetti);
  else { confettiRunning = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ---------- Pick a game for us ----------
   Lights race round the tiles, slow down, and stop on a random game. */
const pickBtn = document.getElementById("pickBtn");
const pickResult = document.getElementById("pickResult");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastPick = -1;

function pickGame() {
  const n = tiles.length;
  let target;
  do { target = Math.floor(Math.random() * n); } while (n > 1 && target === lastPick);
  lastPick = target;
  tiles.forEach((t) => t.el.classList.remove("lit", "winner"));
  pickBtn.disabled = true;
  pickResult.textContent = "Drumroll…";

  const finish = () => {
    tiles.forEach((t) => t.el.classList.remove("lit"));
    const win = tiles[target];
    win.el.classList.add("lit", "winner");
    win.el.focus({ preventScroll: true });
    win.el.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
    pickResult.textContent = "Tonight’s pick: " + win.game.name + "!";
    fanfare();
    if (!reduceMotion) {
      const r = win.el.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 3, 160);
    }
    pickBtn.disabled = false;
    setTimeout(() => win.el.classList.remove("winner"), 2600);
  };

  if (reduceMotion) { finish(); return; }

  // At least three laps, ending on the target
  const steps = n * 3 + ((target - (lastLit + 1) + n * 10) % n) + 1;
  let step = 0;
  const run = () => {
    tiles.forEach((t) => t.el.classList.remove("lit"));
    lastLit = (lastLit + 1) % n;
    tiles[lastLit].el.classList.add("lit");
    tick();
    step++;
    if (step >= steps) { setTimeout(finish, 350); return; }
    const progress = step / steps;
    setTimeout(run, 55 + Math.pow(progress, 3) * 420);
  };
  run();
}
let lastLit = -1;
pickBtn.addEventListener("click", pickGame);

/* ---------- Start ---------- */
wakeAll(false);
startKeepAwake();
tiles[0].el.focus({ preventScroll: true });
</script>
